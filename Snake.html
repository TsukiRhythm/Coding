<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to right, #1e5799, #7db9e9);
      color: #fff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 25px;
      text-align: center;
    }

    canvas {
      background-color: #1d1d1d;
      border: 1px solid #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    #score-container {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <canvas id="SnakeCanvas" width="400" height="400"></canvas>
  <div id="score-container">
    <div id="score">Score : <span id="current-score">0</span></div>
    <div id="high-score-text">High-Score : <span id="high-score">0</span></div>
  </div>

  <script>
    const canvas = document.getElementById("SnakeCanvas");
    const ctx = canvas.getContext("2d");
    const gridSize = 20;
    const canvasSize = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let direction = "right";
    let food = getRandomFood();
    let score = 0;
    let highScore = 0;
    let speed = 150;

    function getRandomFood() {
      return {
        x: Math.floor(Math.random() * canvasSize),
        y: Math.floor(Math.random() * canvasSize),
      };
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#ff4081" : "#fff";
        ctx.shadowBlur = index === 0 ? 10 : 0;
        ctx.shadowColor = "#ff4081";
        ctx.fillRect(
          segment.x * gridSize,
          segment.y * gridSize,
          gridSize,
          gridSize
        );
      });
    }

    function drawFood() {
      ctx.fillStyle = "#00ff00";
      ctx.shadowBlur = 0;
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
    }

    function moveSnake() {
      const head = { ...snake[0] };
      if (direction === "up") head.y--;
      if (direction === "down") head.y++;
      if (direction === "left") head.x--;
      if (direction === "right") head.x++;

      snake.unshift(head);

      
      if (head.x === food.x && head.y === food.y) {
        score++;
        if (score > highScore) highScore = score;
        document.getElementById("current-score").textContent = score;
        document.getElementById("high-score").textContent = highScore;
        food = getRandomFood();
      } else {
        snake.pop();
      }

    
      if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= canvasSize ||
        head.y >= canvasSize ||
        snake.slice(1).some((seg) => seg.x === head.x && seg.y === head.y)
      ) {
        resetGame();
      }
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      direction = "right";
      score = 0;
      document.getElementById("current-score").textContent = score;
      food = getRandomFood();
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSnake();
      drawFood();
      moveSnake();
    }

    setInterval(gameLoop, speed);

    document.addEventListener("keydown", (e) => {
      if ((e.code === "ArrowUp" || e.key === "w" || e.key === "W") && direction !== "down") {
        direction = "up";
      }
      if ((e.code === "ArrowDown" || e.key === "s" || e.key === "S") && direction !== "up") {
        direction = "down";
      }
      if ((e.code === "ArrowLeft" || e.key === "a" || e.key === "A") && direction !== "right") {
        direction = "left";
      }
      if ((e.code === "ArrowRight" || e.key === "d" || e.key === "D") && direction !== "left") {
        direction = "right";
      }
    });
  </script>
</body>

</html>
